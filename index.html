<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flashcard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Flashcard</h1>

      <div id="add-view">
        <form id="add-form" class="add-form">
          <label>
            Front
            <textarea id="front-input" name="front" rows="2"></textarea>
          </label>
          <label>
            Back
            <textarea id="back-input" name="back" rows="2"></textarea>
          </label>
          <div id="form-error" class="form-error" hidden>
            <p>Front and back cannot be empty.</p>
            <button type="button" id="form-error-clear">Clear</button>
          </div>
          <button type="submit" id="add-button">Add</button>
      </form>
      <div class="button-group">
        <button type="button" id="list-button">Word List</button>
        <button type="button" class="single-view-button" id="single-view-button-add">Single Word</button>
      </div>
    </div>

    <div id="list-view" hidden>
      <div class="button-group">
        <button type="button" id="shuffle-button">Shuffle</button>
        <label class="toggle-switch" id="random-toggle-button">
          <input type="checkbox" id="random-toggle-checkbox" />
          <span class="toggle-slider"></span>
          <span class="toggle-label">Random</span>
        </label>
        <button type="button" id="side-select-button" hidden>Front First</button>
      </div>
        <div class="button-group">
          <button type="button" id="up-batch-button">Up</button>
          <button type="button" id="down-batch-button">Down</button>
        </div>
        <p id="empty-state" class="empty-state" hidden>No cards yet. Add one above.</p>
        <ul id="card-list" class="card-list"></ul>
        <div class="button-group">
          <button type="button" id="back-to-add-button">Add Word</button>
          <button type="button" class="single-view-button" id="single-view-button-list">Single Word</button>
        </div>
      </div>

      <div id="single-word-view" hidden>
        <div id="single-card-container" class="single-card"></div>
        <div class="button-group">
          <button type="button" id="next-card-button" class="next-word-button">Next Word</button>
          <button type="button" id="shuffle-single-button">Shuffle</button>
          <label class="toggle-switch" id="random-toggle-single-button">
            <input type="checkbox" id="random-toggle-single-checkbox" />
            <span class="toggle-slider"></span>
            <span class="toggle-label">Random</span>
          </label>
          <button type="button" id="side-select-single-button" hidden>Front First</button>
        </div>
        <div class="button-group">
          <button type="button" id="back-to-add-single-button">Add Word</button>
          <button type="button" id="return-from-single-button">Word List</button>
        </div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
